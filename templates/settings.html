{% extends "base.html" %}
{% block title %}Settings - SSH Panel{% endblock %}
{% block content %}
  <h1>Settings</h1>
  <div class="settings-section">
    <h2>Panel password</h2>
    <form method="post" action="{{ url_for('settings') }}" class="form">
      <input type="hidden" name="action" value="panel_password">
      <label>Current password <input type="password" name="current_password" required autocomplete="current-password"></label>
      <label>New password <input type="password" name="new_password" required autocomplete="new-password"></label>
      <label>Confirm new password <input type="password" name="confirm_password" required autocomplete="new-password"></label>
      <button type="submit">Change password</button>
    </form>
  </div>
  <div class="settings-section">
    <h2>SSH port</h2>
    <form method="post" action="{{ url_for('settings') }}" class="form inline-form">
      <input type="hidden" name="action" value="ssh_port">
      <label>Port <input type="number" name="ssh_port" min="1" max="65535" value="{{ ssh_port }}" required></label>
      <button type="submit">Save</button>
    </form>
  </div>
  <div class="settings-section">
    <h2>Auto restart (5 AM & 5 PM)</h2>
    <p class="settings-status">Status: {% if auto_restart %}<strong class="status-on">Enabled</strong>{% else %}<strong class="status-off">Disabled</strong>{% endif %}</p>
    {% if auto_restart %}
    <form method="post" action="{{ url_for('settings') }}" class="inline-form">
      <input type="hidden" name="action" value="auto_restart_disable">
      <button type="submit" class="btn btn-warn">Disable</button>
    </form>
    {% else %}
    <form method="post" action="{{ url_for('settings') }}" class="inline-form">
      <input type="hidden" name="action" value="auto_restart_enable">
      <button type="submit">Enable</button>
    </form>
    {% endif %}
  </div>
{% endblock %}
